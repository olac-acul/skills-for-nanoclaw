name: compose
# Applies every skill to a clean checkout of upstream NanoClaw with upstream's
# own skill engine and runs the build and tests. The nightly run is what tells
# us when a new upstream commit breaks an integration point.
on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: Upstream ref to test against
        default: main
# The token can only read the repository.
permissions:
  contents: read
jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      # The agent-runner tests of some skills run under Bun, as upstream's container does.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      # The input goes through the environment, never into the shell command line.
      - run: node scripts/compose.mjs --ref "$UPSTREAM_REF"
        env:
          UPSTREAM_REF: ${{ github.event.inputs.ref || 'main' }}
      # The nightly run also takes the composed tree through update-install.mjs: a clean merge and a conflict,
      # against a local stand-in for upstream with one more commit.
      - run: node scripts/update-rehearsal.mjs
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
