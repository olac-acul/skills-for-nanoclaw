name: privacy
on:
  push:
  pull_request:
# The token can only read the repository.
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test "scripts/*.test.mjs"
      - run: node scripts/privacy-scan.mjs --all --history --history-content
